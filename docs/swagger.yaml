  models.APIKey:
    properties:
      createdAt:
        example: "2026-07-02T10:00:00Z"
        type: string
      id:
        example: 8c3f910d-4f81-4e8e-a4e0-54a9c9d0e55f
        type: string
      isDefault:
        example: true
        type: boolean
      keyPrefix:
        example: wcai_Bv6f
        type: string
      last4:
        example: 9xQ2
        type: string
      lastUsedAt:
        example: "2026-07-02T10:00:00Z"
        type: string
      name:
        example: Production
        type: string
      updatedAt:
        example: "2026-07-02T10:00:00Z"
        type: string
    type: object
  models.APIResponse:
    properties:
