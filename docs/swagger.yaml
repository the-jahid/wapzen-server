  /v1/tools/{tool_id}:
    delete:
      description: Deletes a tool owned by the authenticated user and detaches it
        from every agent using it. Calls already in progress keep the tool for the
        rest of the call.
      parameters:
      - description: Tool id
        in: path
        name: tool_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.toolDeleteEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Tool
      tags:
      - Tools
    get:
      description: Returns a single tool owned by the authenticated user, including
        its configuration block.
      parameters:
      - description: Tool id
        in: path
        name: tool_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.toolEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Tool
      tags:
      - Tools
    patch:
      consumes:
      - application/json
      description: 'Applies a partial update to a tool; at least one field must be
        supplied. A configuration block replaces the stored one wholesale rather than
        merging into it. type is fixed at creation — delete the tool and create it
        again to change it. Changes take effect on the next call: a call already in
        progress keeps the tool definitions it started with.'
      parameters:
      - description: Tool id
        in: path
        name: tool_id
        required: true
        type: string
      - description: The tool fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.toolRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.toolEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Tool
      tags:
      - Tools
  /v1/users/me:
    get:
      description: Returns the application user for the authenticated Clerk session,
        including the internal user id.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
  /v1/voices/elevenlabs:
    get:
      description: Proxies the ElevenLabs voices API using the server's workspace
        key. These voices are usable for calls immediately, unlike library voices.
        Pagination uses the opaque next_page_token returned by ElevenLabs.
      parameters:
      - description: Free-text search
        in: query
        name: search
        type: string
      - description: Voice category (premade, cloned, generated, professional)
        in: query
        name: category
        type: string
      - description: Voice type filter
        in: query
        name: voice_type
        type: string
      - description: Results per page (1-100)
        in: query
        name: page_size
        type: integer
      - description: Pagination token from a previous response
        in: query
        name: next_page_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.voiceListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List workspace ElevenLabs voices
      tags:
      - voices
  /v1/voices/elevenlabs/library:
    get:
      description: Proxies the ElevenLabs shared-voices API using the server's workspace
        key. Supports the same filters as the ElevenLabs library UI (search, category,
        gender, age, accent, language, use cases) with page-number pagination.
      parameters:
      - description: Free-text search
        in: query
        name: search
        type: string
      - description: Voice category (professional, famous, high_quality)
        in: query
        name: category
        type: string
      - description: Voice gender
        in: query
        name: gender
        type: string
      - description: Voice age band
        in: query
        name: age
        type: string
      - description: Voice accent
        in: query
        name: accent
        type: string
      - description: Voice language code
        in: query
        name: language
        type: string
      - description: Comma-separated use cases
        in: query
        name: use_cases
        type: string
      - description: Sort order (trending, created_date, cloned_by_count, usage_character_count_1y)
        in: query
        name: sort
        type: string
      - description: Zero-based page index
        in: query
        name: page
        type: integer
      - description: Results per page (1-100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.voiceListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Browse the ElevenLabs voice library
      tags:
      - voices
  /v1/voices/elevenlabs/library/{public_owner_id}/{voice_id}:
    post:
      consumes:
      - application/json
      description: Library voice ids cannot be used for speech until the voice is
        added to the workspace. This copies the voice and returns the workspace voice
        id to persist on the agent. Adding a voice that is already present returns
        the existing voice.
      parameters:
      - description: Library voice owner id
        in: path
        name: public_owner_id
        required: true
        type: string
      - description: Library voice id
        in: path
        name: voice_id
        required: true
        type: string
      - description: Name to save the voice under
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.addLibraryVoiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.addedVoiceEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Add a library voice to the workspace
      tags:
      - voices
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
