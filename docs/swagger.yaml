  /v1/knowledge-base/{knowledge_base_id}/sources:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: 'Adds sources to an existing knowledge base owned by the authenticated
        API key owner and indexes them into its vector-store namespace. Sources arrive
        one of two ways. A JSON body carries raw texts in knowledge_base_texts. A
        multipart/form-data body uploads documents in repeated "files" parts, optionally
        named by repeated "titles" parts (the nth title belongs to the nth file, and
        a blank or missing one falls back to the filename); the server extracts the
        text from each upload — .txt, .md, .csv, .tsv, .json, .yaml, .xml, .log, .rst,
        .html, .docx and .pdf are read — so nothing is parsed client-side. Either
        way the resulting text is chunked using the knowledge base''s own max_chunk_size
        and min_chunk_size, embedded, and written under its namespace_id with the
        source title as the record id; a source that splits into several chunks stores
        the first under the title and the rest under "<title>#2", "<title>#3" and
        so on. Titles must be printable ASCII, must not contain ''#'', and must be
        unique within the knowledge base. Indexing runs synchronously, so the knowledge
        base is returned already at status complete with the new sources attached.
        knowledge_base_urls and the JSON knowledge_base_files (file_url) form are
        still rejected: urls have no fetcher yet, and a file is uploaded rather than
        linked. The request is all-or-nothing — a failure to index leaves the knowledge
        base exactly as it was, at status error.'
      parameters:
      - description: Knowledge base id
        in: path
        name: knowledge_base_id
        required: true
        type: string
      - description: The raw texts to add (application/json)
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.addKnowledgeBaseSourcesRequest'
      - description: Documents to extract and index (multipart/form-data; repeat the
          field for several files)
        in: formData
        name: files
        type: file
      - description: Optional source titles, one per file in the same order (multipart/form-data)
        in: formData
        name: titles
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.knowledgeBaseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
