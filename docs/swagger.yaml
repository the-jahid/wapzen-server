host: localhost:8080
info:
  contact: {}
  description: Backend API foundation for the WhatsApp AI Voice Caller application.
  title: WhatsApp AI Caller API
  version: "1.0"
paths:
  /api/webhooks/clerk:
    post:
      consumes:
      - application/json
      description: Verifies Svix headers and syncs Clerk user events into Postgres.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Clerk webhook
      tags:
      - webhooks
  /health:
    get:
      description: Returns the current status of the server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Health check
      tags:
      - health
  /v1/agents:
    get:
      description: Returns a paginated list of the agents owned by the authenticated
        user. Supports sparse fieldsets via the fields query parameter (dot-notation
        selects a nested property, e.g. agent.language).
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (1-100)
        in: query
        name: limit
        type: integer
      - description: Comma-separated sparse fieldset
        in: query
        name: fields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get All Agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Creates a new outbound agent owned by the authenticated user. Only
        the agent.name field is required; every other field falls back to its schema
        default. If agent.phone_number_id is set, the phone number must belong to
        the user and must not already be assigned to another agent. Every id in knowledge_base.knowledge_base_ids
        must reference a knowledge base owned by the same user.
      parameters:
      - description: Agent configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agents.agentEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Agent
      tags:
      - agents
  /v1/agents/{agent_id}:
    delete:
      description: 'Deletes an agent owned by the authenticated user. A knowledge
        base belongs to the agent that attached it, so this deletes those too — with
        their sources and every vector indexed under their namespaces. Detach any
        worth keeping first by removing its id from the agent''s knowledge_base.knowledge_base_ids.
        Tools are shared rather than owned: they are detached and stay in the account
        for the agents that still use them. Any phone number assigned to the agent
        is released rather than deleted.'
      parameters:
      - description: Agent id
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Agent
      tags:
      - agents
    get:
      description: Returns a single agent owned by the authenticated user, including
        its attached knowledge base and tool ids.
      parameters:
      - description: Agent id
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agents.agentEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Agent
      tags:
      - agents
    patch:
      consumes:
      - application/json
      description: Applies a partial update to an outbound agent owned by the authenticated
        user. Only the supplied fields are changed; absent fields keep their stored
        value. Assigning agent.phone_number_id is rejected with 409 when another agent
        already uses that phone number. Sending knowledge_base.knowledge_base_ids
        replaces the agent's knowledge base attachments wholesale; omitting it leaves
        them untouched.
      parameters:
      - description: Agent id
        in: path
        name: agent_id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agents.agentEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Agent
      tags:
      - agents
  /v1/api-keys:
    get:
      description: Returns metadata for the authenticated user's active API keys.
        Secrets are never returned after creation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.apiKeyListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - apiKeys
    post:
      consumes:
      - application/json
      description: Creates a new API key for the authenticated user and returns the
        bearer secret once. Store the key securely; future list responses only include
        metadata.
      parameters:
      - description: API key name
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.createdAPIKeyEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - apiKeys
  /v1/api-keys/{api_key_id}:
    delete:
      description: Deletes an API key owned by the authenticated user. Deleted keys
        can no longer be used for bearer authentication. A user cannot delete their
        only remaining active API key.
      parameters:
      - description: API key id
        in: path
        name: api_key_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.revokedAPIKeyEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete API key
      tags:
      - apiKeys
  /v1/api-keys/{api_key_id}/default:
    patch:
      description: Marks an active API key owned by the authenticated user as the
        default API key. Exactly one active key is default per user.
      parameters:
      - description: API key id
        in: path
        name: api_key_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.defaultAPIKeyEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Set default API key
      tags:
      - apiKeys
  /v1/calls:
    get:
      description: Returns a paginated list of the calls handled for the authenticated
        API key owner, newest first.
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (1-200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.callListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List Calls
      tags:
      - Calls
    post:
      consumes:
      - application/json
      description: Places an outbound WhatsApp call from a connected phone number
        owned by the authenticated API key owner. The agent that speaks is the one
        assigned to that phone number; agent_id is optional and only asserts which
        agent that is. Returns as soon as the callee's phone is ringing — the returned
        call starts in the "received" status and reaches "answered" when the callee
        picks up, or "declined" if they cut it while it rings.
      parameters:
      - description: The call to place
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createCallRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.callEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Call
      tags:
      - Calls
  /v1/calls/{call_id}:
    delete:
      description: Deletes a call owned by the authenticated user. The saved conversation
        transcript is removed with it.
      parameters:
      - description: Call id
        in: path
