      message:
        type: string
      success:
        type: boolean
    type: object
  models.Call:
    properties:
      agent_id:
        example: agent_12345
        type: string
      answered_at:
        example: "2026-07-24T10:00:05Z"
        type: string
      call_id:
        example: C7A1B2C3D4E5F6
        type: string
      call_type:
        example: inbound
        type: string
      campaign_id:
        example: campaign_a456426614174000
        type: string
      created_at:
        example: "2026-07-24T10:00:00Z"
        type: string
      duration_seconds:
        example: 42
        type: integer
      end_reason:
        example: caller hung up
        type: string
      ended_at:
        example: "2026-07-24T10:00:47Z"
        type: string
      id:
        example: 9f45d8b4-f76f-43f4-8e69-96c7f9eac7f4
        type: string
      lead_id:
        example: lead_b7218f2265ca4000
        type: string
      messages:
        items:
          $ref: '#/definitions/models.CallMessage'
        type: array
      peer:
        example: 15557654321@s.whatsapp.net
        type: string
      phone_number_id:
        example: phone_number_12345
        type: string
      status:
        example: ended
        type: string
      updated_at:
        example: "2026-07-24T10:00:47Z"
        type: string
    type: object
  models.CallMessage:
    properties:
      content:
        example: Hello! How can I help you today?
        type: string
      role:
        example: assistant
        type: string
    type: object
  models.CampaignAnalytics:
    properties:
      calls:
        $ref: '#/definitions/models.CampaignCallTotals'
      campaign_id:
        example: campaign_a456426614174000
        type: string
      daily:
        description: |-
          Daily is one row per day, oldest first, zero-filled so a day with no calls
          is a gap in the chart rather than a missing bar.
        items:
          $ref: '#/definitions/models.CampaignDailyActivity'
        type: array
      end_reasons:
        description: |-
          EndReasons are the most common reasons this campaign's calls ended, most
          frequent first. Calls that never recorded one are left out.
        items:
          $ref: '#/definitions/models.CampaignEndReason'
        type: array
      first_call_at:
        example: "2026-08-10T10:00:00Z"
        type: string
      last_call_at:
        example: "2026-08-14T16:20:00Z"
        type: string
      leads:
        $ref: '#/definitions/models.CampaignLeadTotals'
      pickup_rate:
        description: |-
          PickupRate is answered calls over calls placed; SuccessRate is calls that
          were answered and then ended normally over calls placed; ReachRate is the
          share of leads that have been called. All three are 0 when their
          denominator is, rather than NaN.
        example: 0.62
        type: number
      reach_rate:
        example: 0.41
        type: number
      success_rate:
        example: 0.28
        type: number
      talk_time:
        $ref: '#/definitions/models.CampaignTalkTime'
    type: object
  models.CampaignCallTotals:
    properties:
      answered:
        example: 2
        type: integer
      connected:
        example: 60
        type: integer
      declined:
        example: 18
        type: integer
      ended:
        example: 70
        type: integer
      failed:
        example: 5
        type: integer
      received:
        example: 1
        type: integer
      successful:
        example: 58
        type: integer
      total:
        example: 96
        type: integer
    type: object
  models.CampaignDailyActivity:
    properties:
      answered:
        example: 7
        type: integer
      calls:
        example: 12
        type: integer
      date:
        example: "2026-08-14"
        type: string
    type: object
  models.CampaignEndReason:
    properties:
      count:
        example: 23
        type: integer
      reason:
        example: callee hung up
        type: string
    type: object
  models.CampaignLeadTotals:
    properties:
      called:
        example: 43
        type: integer
      calling:
        example: 2
        type: integer
      failed:
        example: 11
        type: integer
      pending:
        example: 64
        type: integer
      total:
        example: 120
        type: integer
    type: object
  models.CampaignTalkTime:
    properties:
      average_seconds:
        example: 124
        type: integer
      longest_seconds:
        example: 431
        type: integer
      total_seconds:
        example: 7420
        type: integer
    type: object
  models.CreatedAPIKey:
    properties:
      createdAt:
        example: "2026-07-02T10:00:00Z"
        type: string
      id:
        example: 8c3f910d-4f81-4e8e-a4e0-54a9c9d0e55f
        type: string
      isDefault:
        example: true
        type: boolean
      key:
        example: wcai_Bv6fLwL8y6bpiGvM_rJX8oBsZw8QSg6DSxQ7VhA_9xQ2
        type: string
      keyPrefix:
        example: wcai_Bv6f
        type: string
      last4:
        example: 9xQ2
        type: string
      lastUsedAt:
        example: "2026-07-02T10:00:00Z"
        type: string
      name:
        example: Production
        type: string
      updatedAt:
        example: "2026-07-02T10:00:00Z"
        type: string
    type: object
  models.KnowledgeBase:
    properties:
      agent_id:
        description: |-
          AgentID is the agent this knowledge base belongs to, or null while it
          belongs to none. Read-only here: a knowledge base is attached by writing
          the owning agent's knowledge_base.knowledge_base_ids, so the fact has one
          write path rather than two that can disagree. It is returned so a client
          can see which bases are already spoken for before it tries to attach one.
        example: agent_12345
        type: string
      enable_auto_refresh:
        example: false
        type: boolean
      knowledge_base_id:
        example: knowledge_base_a456426614174000
        type: string
      knowledge_base_name:
        example: Sample KB
        type: string
      knowledge_base_sources:
        items:
          $ref: '#/definitions/models.KnowledgeBaseSource'
        type: array
      last_refreshed_timestamp:
        example: 1703413636133
        type: integer
      max_chunk_size:
        example: 2000
        type: integer
      min_chunk_size:
        example: 400
        type: integer
      namespace_id:
        description: |-
          NamespaceID is the vector-store namespace holding this knowledge base's
          chunks (the pinecone_namespace column). It is assigned at creation, so
          every knowledge base created through this API has one; the pointer covers
          rows predating that, which the backfill migration has since filled in.
        example: kb_a456426614174000
        type: string
      status:
        example: in_progress
        type: string
    type: object
  models.KnowledgeBaseSource:
    properties:
      chunk_count:
        example: 3
        type: integer
      source_id:
        example: source_c656426614174002
        type: string
      title:
        example: Refund policy
        type: string
      type:
        example: text
        type: string
    type: object
  models.OutboundCampaign:
    properties:
      agent_id:
        description: |-
          AgentID is the agent the campaign dials with, and the only half of the
          pairing a caller sets: the agent already carries the number it speaks on,
          so AgentName, PhoneNumberID and PhoneNumber are read off the agent on
          every read rather than stored here, and cannot disagree with it.
        example: agent_9f1c2d3e4b5a6789
        type: string
      agent_name:
        example: Pearl
        type: string
      answered_calls:
        example: 412
        type: integer
      budget_usd:
        example: 250
        type: number
      calls_placed:
        example: 656
        type: integer
      campaign_id:
        example: campaign_a456426614174000
        type: string
      campaign_name:
        example: July reactivation
        type: string
      completed_at:
        example: "2026-08-10T18:00:00Z"
        type: string
      created_at:
        example: "2026-08-01T08:42:00Z"
        type: string
      leads_count:
        description: Counters, maintained by the server as the campaign places calls.
        example: 1240
        type: integer
      phone_number:
        example: "+390232164148"
        type: string
      phone_number_id:
        example: pn_2c1d4e5f6a7b8c90
        type: string
      pickup_rate:
        description: |-
          PickupRate and SuccessRate are derived from the counters by
          ApplyDerivedFields rather than stored, so they can never disagree with the
          numbers they come from.
        example: 0.628
        type: number
      started_at:
        example: "2026-08-01T09:00:00Z"
        type: string
      status:
        example: running
        type: string
      success_rate:
        example: 0.287
        type: number
      successful_calls:
        example: 188
        type: integer
      today_calls:
        example: 37
        type: integer
      total_usage_seconds:
        example: 74520
        type: integer
      updated_at:
        example: "2026-08-10T11:15:00Z"
        type: string
    type: object
  models.PhoneNumber:
    properties:
      created_at:
        example: "2026-07-03T10:00:00Z"
        type: string
      id:
        example: phone_number_12345
        type: string
      label:
        example: Main support line
        type: string
      last_connected_at:
        example: "2026-07-03T10:00:00Z"
        type: string
      phone_number:
        example: "+15551234567"
        type: string
      qr_code:
        type: string
      status:
        example: pending_qr
        type: string
      updated_at:
        example: "2026-07-03T10:00:00Z"
        type: string
      wa_jid:
        example: 15551234567:1@s.whatsapp.net
        type: string
    type: object
  models.Tool:
    properties:
      agent_ids:
        description: |-
          AgentIDs and ChatAgentIDs are the agents this tool is attached to, empty
          while it is attached to none. A tool is shared: the same definition can be
          attached to any number of agents of either kind. Read-only here: a tool is
          attached by writing that agent's tools.tool_ids, so the fact has one write
          path rather than two that can disagree. They are returned so a client can
          see where a tool is in use before it changes or deletes one.
        items:
          type: string
        type: array
      api_request:
        $ref: '#/definitions/models.ToolAPIRequestConfig'
      chat_agent_ids:
        items:
          type: string
