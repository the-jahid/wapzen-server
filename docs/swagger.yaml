        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/models.APIResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
