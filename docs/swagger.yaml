        and omitted settings fall back to their defaults. The vector-store namespace_id
        is assigned automatically and returned with the new knowledge base. Texts
        supplied in knowledge_base_texts are chunked, embedded and indexed into that
        namespace as part of the request, so the response carries the knowledge base
        already at status complete with its sources attached; a knowledge base created
        without texts starts empty at status in_progress. The create is all-or-nothing
        — if indexing fails the knowledge base is removed again and the request can
        be retried unchanged. knowledge_base_urls and knowledge_base_files (file_url)
        are rejected: urls have no fetcher yet, and documents are uploaded rather
        than linked, via POST /v1/knowledge-base/{knowledge_base_id}/sources as multipart/form-data.'
