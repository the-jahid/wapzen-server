    get:
      description: Returns a single call owned by the authenticated user, including
        the saved AI/user conversation transcript.
      parameters:
      - description: Call id
        in: path
        name: call_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.callEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Call
      tags:
      - Calls
    patch:
      consumes:
      - application/json
      description: Applies a partial update to a call owned by the authenticated user.
        Only status and end_reason may be changed; at least one must be supplied.
        status must be one of received, answered, ended, declined, failed.
      parameters:
      - description: Call id
        in: path
